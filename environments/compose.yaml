name: rabbitmq-reference-atlas

x-rabbitmq: &rabbitmq
  image: rabbitmq:4.3.5-management@sha256:45226f38499559b9f56875c752cc6689ff90e8f20796fe80fd9bc28d64723031
  restart: "no"
  environment:
    RABBITMQ_DEFAULT_USER: atlas
    RABBITMQ_DEFAULT_PASS: atlas-local-only
    RABBITMQ_ERLANG_COOKIE: rabbitmq-reference-atlas-cookie
  configs:
    - source: rabbitmq-config
      target: /etc/rabbitmq/rabbitmq.conf
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 3s
    timeout: 5s
    retries: 60
    start_period: 10s
  networks: [atlas-cluster]

services:
  rabbitmq-1:
    <<: *rabbitmq
    hostname: rabbitmq-1
    environment:
      RABBITMQ_DEFAULT_USER: atlas
      RABBITMQ_DEFAULT_PASS: atlas-local-only
      RABBITMQ_ERLANG_COOKIE: rabbitmq-reference-atlas-cookie
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
    ports:
      - "25672:5672"
      - "35672:15672"
    volumes:
      - rabbitmq-1-data:/var/lib/rabbitmq
  rabbitmq-2:
    <<: *rabbitmq
    hostname: rabbitmq-2
    environment:
      RABBITMQ_DEFAULT_USER: atlas
      RABBITMQ_DEFAULT_PASS: atlas-local-only
      RABBITMQ_ERLANG_COOKIE: rabbitmq-reference-atlas-cookie
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
    ports:
      - "25673:5672"
      - "35673:15672"
    volumes:
      - rabbitmq-2-data:/var/lib/rabbitmq
  rabbitmq-3:
    <<: *rabbitmq
    hostname: rabbitmq-3
    environment:
      RABBITMQ_DEFAULT_USER: atlas
      RABBITMQ_DEFAULT_PASS: atlas-local-only
      RABBITMQ_ERLANG_COOKIE: rabbitmq-reference-atlas-cookie
      RABBITMQ_NODENAME: rabbit@rabbitmq-3
    ports:
      - "25674:5672"
      - "35674:15672"
    volumes:
      - rabbitmq-3-data:/var/lib/rabbitmq

configs:
  rabbitmq-config:
    file: ./rabbitmq.conf

networks:
  atlas-cluster:
    name: rabbitmq-reference-atlas-cluster

volumes:
  rabbitmq-1-data:
  rabbitmq-2-data:
  rabbitmq-3-data:

