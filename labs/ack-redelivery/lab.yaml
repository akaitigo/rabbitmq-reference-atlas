schema_version: 1
id: ack-redelivery
claims: [delivery.acknowledgement, delivery.redelivery]
profile: cluster
setup: Durable Classic Queueへ一MessageをPublishする。
execute: autoAck=falseで取得し、Nack(requeue=true)して再取得後にAckする。
verify: 初回false、再配送trueのRedelivered FlagとMessage ID一致を機械判定する。
cleanup: Queueを削除する。

