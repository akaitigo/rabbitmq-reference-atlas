schema_version: 1
id: plugin-protocols
claims:
  - definitive.mqtt.protocol-versions-qos.claim
  - definitive.stomp.protocol-plugin.claim
profile: cluster
setup: 既存三Nodeの有効Pluginを記録し、公式MQTT、STOMP、Stream Pluginを一時的に有効化する。Volume、Queue、既存Messageは削除しない。
execute: Container内の固定Harnessから全三NodeへMQTT 3.1/3.1.1/5.0とQoS 0/1、STOMP 1.0/1.1/1.2のpacketを送信する。
verify: Behaviorごとに正常、境界、誤Credential拒否、Version互換の専用JSON Artifactを生成し、全三Nodeを個別に判定する。
cleanup: 実行前に無効だったPluginだけを無効化し、実行前のPlugin状態へ戻す。Harnessが作成したMQTT SessionはClean Sessionで終了する。
