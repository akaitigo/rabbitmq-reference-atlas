name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true
      - name: Install pinned atlas validator
        run: go install github.com/akaitigo/reference-atlas-core/cmd/atlas@6793642472d4011786c35b98fdb60cd4212e9699
      - name: Validate manifests, Router Skill, rights and repository graph
        env:
          ATLAS_BIN: /home/runner/go/bin/atlas
        run: make check
      - name: Execute RabbitMQ Labs and regenerate Evidence
        run: make labs
      - name: Verify generated Evidence with atlas validate
        env:
          ATLAS_BIN: /home/runner/go/bin/atlas
        run: make atlas-validate repo-validate
