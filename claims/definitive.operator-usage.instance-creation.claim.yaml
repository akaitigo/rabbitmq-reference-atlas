statement: RabbitmqCluster reconciliation to StatefulSet, Service, Pods, and credentialsのRabbitMQ
  4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-operator-usage
proof_obligations:
- id: proof.operator-usage.instance-creation.normal
  statement: RabbitmqCluster reconciliation to StatefulSet, Service, Pods, and credentialsのnormal
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.operator-usage.instance-creation.boundary
  statement: RabbitmqCluster reconciliation to StatefulSet, Service, Pods, and credentialsのboundary
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.operator-usage.instance-creation.rejection
  statement: RabbitmqCluster reconciliation to StatefulSet, Service, Pods, and credentialsのrejection
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.operator-usage.instance-creation.operations
  statement: RabbitmqCluster reconciliation to StatefulSet, Service, Pods, and credentialsのoperations
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - Metrics、Logs、Health、CLI状態を同一Run IDと時刻で相関し、診断から安全な復旧判定まで接続する。
