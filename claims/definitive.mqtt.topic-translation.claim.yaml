  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.mqtt.topic-translation.boundary
  statement: MQTT slash and wildcard translation to AMQP topic routingのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.mqtt.topic-translation.rejection
  statement: MQTT slash and wildcard translation to AMQP topic routingのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.mqtt.topic-translation.compatibility
  statement: MQTT slash and wildcard translation to AMQP topic routingのcompatibility
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 二つ以上のProtocol、Client、Queue、PluginまたはVersion Variantを同一Oracleで比較する。
