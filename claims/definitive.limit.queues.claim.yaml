schema_version: 1
id: definitive.limit.queues.claim
atlas_id: rabbitmq-reference-atlas
capability_id: capacity.limits
statement: Per-virtual-host queue and connection limitsのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-limits
proof_obligations:
- id: proof.limit.queues.normal
  statement: Per-virtual-host queue and connection limitsのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.limit.queues.boundary
  statement: Per-virtual-host queue and connection limitsのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.limit.queues.rejection
  statement: Per-virtual-host queue and connection limitsのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.limit.queues.security
  statement: Per-virtual-host queue and connection limitsのsecurity Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 最小権限の許可と、誤Credential、不正なTrust、越権操作の拒否を同一隔離Environmentで検証する。
- id: proof.limit.queues.performance
  statement: Per-virtual-host queue and connection limitsのperformance Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 条件を固定した複数VariantでRaw Sample、分位、Rate、Memory、Diskを取得し、適用範囲外へ一般化しない。
