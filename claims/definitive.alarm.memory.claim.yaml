schema_version: 1
id: definitive.alarm.memory.claim
atlas_id: rabbitmq-reference-atlas
capability_id: capacity.alarms
statement: Memory watermark alarm and publisher blockingのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-alarms
proof_obligations:
- id: proof.alarm.memory.normal
  statement: Memory watermark alarm and publisher blockingのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.alarm.memory.boundary
  statement: Memory watermark alarm and publisher blockingのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.alarm.memory.rejection
  statement: Memory watermark alarm and publisher blockingのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.alarm.memory.failure
  statement: Memory watermark alarm and publisher blockingのfailure Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 専用Environment内だけに停止、Network断、Resource Alarmまたは依存先障害を注入し、保証Invariantを検証する。
- id: proof.alarm.memory.recovery
  statement: Memory watermark alarm and publisher blockingのrecovery Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 障害要因を取り除き、Membership、Delivery、Telemetryとデータ整合性が制限時間内に回復することを確認する。
- id: proof.alarm.memory.operations
  statement: Memory watermark alarm and publisher blockingのoperations Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - Metrics、Logs、Health、CLI状態を同一Run IDと時刻で相関し、診断から安全な復旧判定まで接続する。
- id: proof.alarm.memory.performance
  statement: Memory watermark alarm and publisher blockingのperformance Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 条件を固定した複数VariantでRaw Sample、分位、Rate、Memory、Diskを取得し、適用範囲外へ一般化しない。
