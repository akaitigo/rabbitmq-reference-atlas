schema_version: 1
id: definitive.stomp.connection-vhost.claim
atlas_id: rabbitmq-reference-atlas
capability_id: security.stomp
statement: STOMP CONNECT authentication and virtual host selectionのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-stomp
proof_obligations:
- id: proof.stomp.connection-vhost.normal
  statement: STOMP CONNECT authentication and virtual host selectionのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.stomp.connection-vhost.boundary
  statement: STOMP CONNECT authentication and virtual host selectionのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.stomp.connection-vhost.rejection
  statement: STOMP CONNECT authentication and virtual host selectionのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.stomp.connection-vhost.security
  statement: STOMP CONNECT authentication and virtual host selectionのsecurity Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 最小権限の許可と、誤Credential、不正なTrust、越権操作の拒否を同一隔離Environmentで検証する。
