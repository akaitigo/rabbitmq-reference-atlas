schema_version: 1
id: definitive.amqp10.protocol-interoperability.claim
atlas_id: rabbitmq-reference-atlas
capability_id: protocol.amqp10
statement: Native message storage and cross-protocol conversionのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-amqp-1.0
proof_obligations:
- id: proof.amqp10.protocol-interoperability.normal
  statement: Native message storage and cross-protocol conversionのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.amqp10.protocol-interoperability.boundary
  statement: Native message storage and cross-protocol conversionのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.amqp10.protocol-interoperability.rejection
  statement: Native message storage and cross-protocol conversionのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.amqp10.protocol-interoperability.compatibility
  statement: Native message storage and cross-protocol conversionのcompatibility Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 二つ以上のProtocol、Client、Queue、PluginまたはVersion Variantを同一Oracleで比較する。
