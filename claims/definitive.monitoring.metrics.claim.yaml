schema_version: 1
id: definitive.monitoring.metrics.claim
atlas_id: rabbitmq-reference-atlas
capability_id: observability.monitoring
statement: Broker client queue and system metricsのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-monitoring
proof_obligations:
- id: proof.monitoring.metrics.normal
  statement: Broker client queue and system metricsのnormal Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.monitoring.metrics.boundary
  statement: Broker client queue and system metricsのboundary Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.monitoring.metrics.rejection
  statement: Broker client queue and system metricsのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.monitoring.metrics.operations
  statement: Broker client queue and system metricsのoperations Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - Metrics、Logs、Health、CLI状態を同一Run IDと時刻で相関し、診断から安全な復旧判定まで接続する。
- id: proof.monitoring.metrics.performance
  statement: Broker client queue and system metricsのperformance Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 条件を固定した複数VariantでRaw Sample、分位、Rate、Memory、Diskを取得し、適用範囲外へ一般化しない。
