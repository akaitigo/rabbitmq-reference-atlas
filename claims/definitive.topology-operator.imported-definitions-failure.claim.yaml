proof_obligations:
- id: proof.topology-operator.imported-definitions-failure.normal
  statement: Imported definitions credential overwrite failure and recovery boundaryのnormal
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.topology-operator.imported-definitions-failure.boundary
  statement: Imported definitions credential overwrite failure and recovery boundaryのboundary
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.topology-operator.imported-definitions-failure.rejection
  statement: Imported definitions credential overwrite failure and recovery boundaryのrejection
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.topology-operator.imported-definitions-failure.failure
  statement: Imported definitions credential overwrite failure and recovery boundaryのfailure
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 専用Environment内だけに停止、Network断、Resource Alarmまたは依存先障害を注入し、保証Invariantを検証する。
- id: proof.topology-operator.imported-definitions-failure.recovery
  statement: Imported definitions credential overwrite failure and recovery boundaryのrecovery
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 障害要因を取り除き、Membership、Delivery、Telemetryとデータ整合性が制限時間内に回復することを確認する。
- id: proof.topology-operator.imported-definitions-failure.security
  statement: Imported definitions credential overwrite failure and recovery boundaryのsecurity
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 最小権限の許可と、誤Credential、不正なTrust、越権操作の拒否を同一隔離Environmentで検証する。
