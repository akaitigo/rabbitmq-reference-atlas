schema_version: 1
id: definitive.mqtt.listener-tls.claim
atlas_id: rabbitmq-reference-atlas
capability_id: security.mqtt
statement: MQTT TCP and TLS listener transport behaviorのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-mqtt
proof_obligations:
- id: proof.mqtt.listener-tls.normal
  statement: MQTT TCP and TLS listener transport behaviorのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.mqtt.listener-tls.boundary
  statement: MQTT TCP and TLS listener transport behaviorのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.mqtt.listener-tls.rejection
  statement: MQTT TCP and TLS listener transport behaviorのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.mqtt.listener-tls.security
  statement: MQTT TCP and TLS listener transport behaviorのsecurity Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 最小権限の許可と、誤Credential、不正なTrust、越権操作の拒否を同一隔離Environmentで検証する。
- id: proof.mqtt.listener-tls.compatibility
  statement: MQTT TCP and TLS listener transport behaviorのcompatibility Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 二つ以上のProtocol、Client、Queue、PluginまたはVersion Variantを同一Oracleで比較する。
