schema_version: 1
id: definitive.prometheus.endpoint.claim
atlas_id: rabbitmq-reference-atlas
capability_id: observability.prometheus
statement: RabbitMQ Prometheus metrics endpointのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-prometheus
proof_obligations:
- id: proof.prometheus.endpoint.normal
  statement: RabbitMQ Prometheus metrics endpointのnormal Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.prometheus.endpoint.boundary
  statement: RabbitMQ Prometheus metrics endpointのboundary Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.prometheus.endpoint.rejection
  statement: RabbitMQ Prometheus metrics endpointのrejection Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.prometheus.endpoint.operations
  statement: RabbitMQ Prometheus metrics endpointのoperations Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - Metrics、Logs、Health、CLI状態を同一Run IDと時刻で相関し、診断から安全な復旧判定まで接続する。
