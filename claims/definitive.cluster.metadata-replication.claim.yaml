schema_version: 1
id: definitive.cluster.metadata-replication.claim
atlas_id: rabbitmq-reference-atlas
capability_id: cluster.membership
statement: Cluster metadata replication boundaryのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-clustering
proof_obligations:
- id: proof.cluster.metadata-replication.normal
  statement: Cluster metadata replication boundaryのnormal Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.cluster.metadata-replication.boundary
  statement: Cluster metadata replication boundaryのboundary Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.cluster.metadata-replication.rejection
  statement: Cluster metadata replication boundaryのrejection Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.cluster.metadata-replication.failure
  statement: Cluster metadata replication boundaryのfailure Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 専用Environment内だけに停止、Network断、Resource Alarmまたは依存先障害を注入し、保証Invariantを検証する。
- id: proof.cluster.metadata-replication.recovery
  statement: Cluster metadata replication boundaryのrecovery Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 障害要因を取り除き、Membership、Delivery、Telemetryとデータ整合性が制限時間内に回復することを確認する。
