schema_version: 1
id: definitive.stream-plugin.consumer-credit.claim
atlas_id: rabbitmq-reference-atlas
capability_id: delivery.stream
statement: Stream consumer chunk credit and replenishment behaviorのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-stream-plugin
proof_obligations:
- id: proof.stream-plugin.consumer-credit.normal
  statement: Stream consumer chunk credit and replenishment behaviorのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.stream-plugin.consumer-credit.boundary
  statement: Stream consumer chunk credit and replenishment behaviorのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.stream-plugin.consumer-credit.rejection
  statement: Stream consumer chunk credit and replenishment behaviorのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.stream-plugin.consumer-credit.failure
  statement: Stream consumer chunk credit and replenishment behaviorのfailure Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 専用Environment内だけに停止、Network断、Resource Alarmまたは依存先障害を注入し、保証Invariantを検証する。
- id: proof.stream-plugin.consumer-credit.recovery
  statement: Stream consumer chunk credit and replenishment behaviorのrecovery Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 障害要因を取り除き、Membership、Delivery、Telemetryとデータ整合性が制限時間内に回復することを確認する。
- id: proof.stream-plugin.consumer-credit.performance
  statement: Stream consumer chunk credit and replenishment behaviorのperformance Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 条件を固定した複数VariantでRaw Sample、分位、Rate、Memory、Diskを取得し、適用範囲外へ一般化しない。
