schema_version: 1
id: definitive.policy.update.claim
atlas_id: rabbitmq-reference-atlas
capability_id: configuration.policies
statement: Runtime policy update and resource effectのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-policies
proof_obligations:
- id: proof.policy.update.normal
  statement: Runtime policy update and resource effectのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.policy.update.boundary
  statement: Runtime policy update and resource effectのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.policy.update.rejection
  statement: Runtime policy update and resource effectのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.policy.update.migration
  statement: Runtime policy update and resource effectのmigration Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定したSourceとTarget Versionの間で継続Workloadを実行し、互換性とRollback不能境界を記録する。
- id: proof.policy.update.operations
  statement: Runtime policy update and resource effectのoperations Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - Metrics、Logs、Health、CLI状態を同一Run IDと時刻で相関し、診断から安全な復旧判定まで接続する。
