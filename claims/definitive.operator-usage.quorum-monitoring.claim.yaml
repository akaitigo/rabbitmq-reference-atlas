- id: proof.operator-usage.quorum-monitoring.normal
  statement: Operator quorum status, RabbitMQ metrics, logs, and alert correlationのnormal
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.operator-usage.quorum-monitoring.boundary
  statement: Operator quorum status, RabbitMQ metrics, logs, and alert correlationのboundary
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.operator-usage.quorum-monitoring.rejection
  statement: Operator quorum status, RabbitMQ metrics, logs, and alert correlationのrejection
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.operator-usage.quorum-monitoring.failure
  statement: Operator quorum status, RabbitMQ metrics, logs, and alert correlationのfailure
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 専用Environment内だけに停止、Network断、Resource Alarmまたは依存先障害を注入し、保証Invariantを検証する。
- id: proof.operator-usage.quorum-monitoring.recovery
  statement: Operator quorum status, RabbitMQ metrics, logs, and alert correlationのrecovery
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 障害要因を取り除き、Membership、Delivery、Telemetryとデータ整合性が制限時間内に回復することを確認する。
- id: proof.operator-usage.quorum-monitoring.operations
  statement: Operator quorum status, RabbitMQ metrics, logs, and alert correlationのoperations
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - Metrics、Logs、Health、CLI状態を同一Run IDと時刻で相関し、診断から安全な復旧判定まで接続する。
