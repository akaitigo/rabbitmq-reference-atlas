schema_version: 1
id: definitive.consumer.priority.claim
atlas_id: rabbitmq-reference-atlas
capability_id: consumer.lifecycle
statement: Consumer priority dispatch behaviorのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-consumers
proof_obligations:
- id: proof.consumer.priority.normal
  statement: Consumer priority dispatch behaviorのnormal Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.consumer.priority.boundary
  statement: Consumer priority dispatch behaviorのboundary Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.consumer.priority.rejection
  statement: Consumer priority dispatch behaviorのrejection Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
