schema_version: 1
id: definitive.upgrade.rollback.claim
atlas_id: rabbitmq-reference-atlas
capability_id: migration.upgrade
statement: Rollback support and irreversible boundaryのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-upgrade
proof_obligations:
- id: proof.upgrade.rollback.normal
  statement: Rollback support and irreversible boundaryのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.upgrade.rollback.boundary
  statement: Rollback support and irreversible boundaryのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.upgrade.rollback.rejection
  statement: Rollback support and irreversible boundaryのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.upgrade.rollback.failure
  statement: Rollback support and irreversible boundaryのfailure Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 専用Environment内だけに停止、Network断、Resource Alarmまたは依存先障害を注入し、保証Invariantを検証する。
- id: proof.upgrade.rollback.recovery
  statement: Rollback support and irreversible boundaryのrecovery Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 障害要因を取り除き、Membership、Delivery、Telemetryとデータ整合性が制限時間内に回復することを確認する。
- id: proof.upgrade.rollback.migration
  statement: Rollback support and irreversible boundaryのmigration Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定したSourceとTarget Versionの間で継続Workloadを実行し、互換性とRollback不能境界を記録する。
