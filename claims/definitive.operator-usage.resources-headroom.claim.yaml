proof_obligations:
- id: proof.operator-usage.resources-headroom.normal
  statement: Resource request validation and RabbitMQ memory headroom calculationのnormal
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.operator-usage.resources-headroom.boundary
  statement: Resource request validation and RabbitMQ memory headroom calculationのboundary
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.operator-usage.resources-headroom.rejection
  statement: Resource request validation and RabbitMQ memory headroom calculationのrejection
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.operator-usage.resources-headroom.failure
  statement: Resource request validation and RabbitMQ memory headroom calculationのfailure
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 専用Environment内だけに停止、Network断、Resource Alarmまたは依存先障害を注入し、保証Invariantを検証する。
- id: proof.operator-usage.resources-headroom.recovery
  statement: Resource request validation and RabbitMQ memory headroom calculationのrecovery
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 障害要因を取り除き、Membership、Delivery、Telemetryとデータ整合性が制限時間内に回復することを確認する。
- id: proof.operator-usage.resources-headroom.performance
  statement: Resource request validation and RabbitMQ memory headroom calculationのperformance
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 条件を固定した複数VariantでRaw Sample、分位、Rate、Memory、Diskを取得し、適用範囲外へ一般化しない。
