schema_version: 1
id: definitive.stomp.stream-support.claim
atlas_id: rabbitmq-reference-atlas
capability_id: protocol.stomp
statement: STOMP stream subscription offset and credit behaviorのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-stomp
proof_obligations:
- id: proof.stomp.stream-support.normal
  statement: STOMP stream subscription offset and credit behaviorのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.stomp.stream-support.boundary
  statement: STOMP stream subscription offset and credit behaviorのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.stomp.stream-support.rejection
  statement: STOMP stream subscription offset and credit behaviorのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.stomp.stream-support.performance
  statement: STOMP stream subscription offset and credit behaviorのperformance Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 条件を固定した複数VariantでRaw Sample、分位、Rate、Memory、Diskを取得し、適用範囲外へ一般化しない。
- id: proof.stomp.stream-support.compatibility
  statement: STOMP stream subscription offset and credit behaviorのcompatibility Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 二つ以上のProtocol、Client、Queue、PluginまたはVersion Variantを同一Oracleで比較する。
