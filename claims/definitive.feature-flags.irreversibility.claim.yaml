schema_version: 1
id: definitive.feature-flags.irreversibility.claim
atlas_id: rabbitmq-reference-atlas
capability_id: migration.feature-flags
statement: Enabled feature flag rollback boundaryのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-feature-flags
proof_obligations:
- id: proof.feature-flags.irreversibility.normal
  statement: Enabled feature flag rollback boundaryのnormal Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.feature-flags.irreversibility.boundary
  statement: Enabled feature flag rollback boundaryのboundary Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.feature-flags.irreversibility.rejection
  statement: Enabled feature flag rollback boundaryのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.feature-flags.irreversibility.failure
  statement: Enabled feature flag rollback boundaryのfailure Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 専用Environment内だけに停止、Network断、Resource Alarmまたは依存先障害を注入し、保証Invariantを検証する。
- id: proof.feature-flags.irreversibility.recovery
  statement: Enabled feature flag rollback boundaryのrecovery Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 障害要因を取り除き、Membership、Delivery、Telemetryとデータ整合性が制限時間内に回復することを確認する。
- id: proof.feature-flags.irreversibility.migration
  statement: Enabled feature flag rollback boundaryのmigration Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定したSourceとTarget Versionの間で継続Workloadを実行し、互換性とRollback不能境界を記録する。
