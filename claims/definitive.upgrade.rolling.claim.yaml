schema_version: 1
id: definitive.upgrade.rolling.claim
atlas_id: rabbitmq-reference-atlas
capability_id: migration.upgrade
statement: Rolling upgrade with mixed-version clusterのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-upgrade
proof_obligations:
- id: proof.upgrade.rolling.normal
  statement: Rolling upgrade with mixed-version clusterのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.upgrade.rolling.boundary
  statement: Rolling upgrade with mixed-version clusterのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.upgrade.rolling.rejection
  statement: Rolling upgrade with mixed-version clusterのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.upgrade.rolling.migration
  statement: Rolling upgrade with mixed-version clusterのmigration Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定したSourceとTarget Versionの間で継続Workloadを実行し、互換性とRollback不能境界を記録する。
