schema_version: 1
id: definitive.protocol.websocket.transports.claim
atlas_id: rabbitmq-reference-atlas
capability_id: protocol.websocket
statement: AMQP 1.0, MQTT, and STOMP over WebSocketのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-protocols
proof_obligations:
- id: proof.protocol.websocket.transports.normal
  statement: AMQP 1.0, MQTT, and STOMP over WebSocketのnormal Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.protocol.websocket.transports.boundary
  statement: AMQP 1.0, MQTT, and STOMP over WebSocketのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.protocol.websocket.transports.rejection
  statement: AMQP 1.0, MQTT, and STOMP over WebSocketのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.protocol.websocket.transports.security
  statement: AMQP 1.0, MQTT, and STOMP over WebSocketのsecurity Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 最小権限の許可と、誤Credential、不正なTrust、越権操作の拒否を同一隔離Environmentで検証する。
- id: proof.protocol.websocket.transports.compatibility
  statement: AMQP 1.0, MQTT, and STOMP over WebSocketのcompatibility Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 二つ以上のProtocol、Client、Queue、PluginまたはVersion Variantを同一Oracleで比較する。
