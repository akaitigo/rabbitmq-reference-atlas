proof_obligations:
- id: proof.topology-operator.namespace-scope.normal
  statement: Same-namespace and explicitly allowed cross-namespace reconciliationのnormal
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.topology-operator.namespace-scope.boundary
  statement: Same-namespace and explicitly allowed cross-namespace reconciliationのboundary
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.topology-operator.namespace-scope.rejection
  statement: Same-namespace and explicitly allowed cross-namespace reconciliationのrejection
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.topology-operator.namespace-scope.security
  statement: Same-namespace and explicitly allowed cross-namespace reconciliationのsecurity
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 最小権限の許可と、誤Credential、不正なTrust、越権操作の拒否を同一隔離Environmentで検証する。
