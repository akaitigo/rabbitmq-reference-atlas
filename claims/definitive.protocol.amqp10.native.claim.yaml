schema_version: 1
id: definitive.protocol.amqp10.native.claim
atlas_id: rabbitmq-reference-atlas
capability_id: protocol.amqp10
statement: Native AMQP 1.0 core protocolのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-protocols
proof_obligations:
- id: proof.protocol.amqp10.native.normal
  statement: Native AMQP 1.0 core protocolのnormal Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.protocol.amqp10.native.boundary
  statement: Native AMQP 1.0 core protocolのboundary Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.protocol.amqp10.native.rejection
  statement: Native AMQP 1.0 core protocolのrejection Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.protocol.amqp10.native.compatibility
  statement: Native AMQP 1.0 core protocolのcompatibility Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 二つ以上のProtocol、Client、Queue、PluginまたはVersion Variantを同一Oracleで比較する。
