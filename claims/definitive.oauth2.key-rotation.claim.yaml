schema_version: 1
id: definitive.oauth2.key-rotation.claim
atlas_id: rabbitmq-reference-atlas
capability_id: security.oauth2
statement: JWKS refresh and signing key rotationのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-oauth2
proof_obligations:
- id: proof.oauth2.key-rotation.normal
  statement: JWKS refresh and signing key rotationのnormal Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.oauth2.key-rotation.boundary
  statement: JWKS refresh and signing key rotationのboundary Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.oauth2.key-rotation.rejection
  statement: JWKS refresh and signing key rotationのrejection Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.oauth2.key-rotation.failure
  statement: JWKS refresh and signing key rotationのfailure Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 専用Environment内だけに停止、Network断、Resource Alarmまたは依存先障害を注入し、保証Invariantを検証する。
- id: proof.oauth2.key-rotation.recovery
  statement: JWKS refresh and signing key rotationのrecovery Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 障害要因を取り除き、Membership、Delivery、Telemetryとデータ整合性が制限時間内に回復することを確認する。
- id: proof.oauth2.key-rotation.operations
  statement: JWKS refresh and signing key rotationのoperations Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - Metrics、Logs、Health、CLI状態を同一Run IDと時刻で相関し、診断から安全な復旧判定まで接続する。
- id: proof.oauth2.key-rotation.security
  statement: JWKS refresh and signing key rotationのsecurity Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 最小権限の許可と、誤Credential、不正なTrust、越権操作の拒否を同一隔離Environmentで検証する。
