proof_obligations:
- id: proof.stomp.listeners-tls.normal
  statement: STOMP TCP, TLS, Web STOMP, and listener configurationのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.stomp.listeners-tls.boundary
  statement: STOMP TCP, TLS, Web STOMP, and listener configurationのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.stomp.listeners-tls.rejection
  statement: STOMP TCP, TLS, Web STOMP, and listener configurationのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.stomp.listeners-tls.security
  statement: STOMP TCP, TLS, Web STOMP, and listener configurationのsecurity Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 最小権限の許可と、誤Credential、不正なTrust、越権操作の拒否を同一隔離Environmentで検証する。
- id: proof.stomp.listeners-tls.compatibility
  statement: STOMP TCP, TLS, Web STOMP, and listener configurationのcompatibility Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 二つ以上のProtocol、Client、Queue、PluginまたはVersion Variantを同一Oracleで比較する。
