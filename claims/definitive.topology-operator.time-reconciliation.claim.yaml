schema_version: 1
id: definitive.topology-operator.time-reconciliation.claim
atlas_id: rabbitmq-reference-atlas
capability_id: operator.topology
statement: Periodic reconciliation, deleted topology recovery, and message loss boundaryのRabbitMQ
  4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-topology-operator-usage
proof_obligations:
- id: proof.topology-operator.time-reconciliation.normal
  statement: Periodic reconciliation, deleted topology recovery, and message loss
    boundaryのnormal Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.topology-operator.time-reconciliation.boundary
  statement: Periodic reconciliation, deleted topology recovery, and message loss
    boundaryのboundary Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.topology-operator.time-reconciliation.rejection
  statement: Periodic reconciliation, deleted topology recovery, and message loss
    boundaryのrejection Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.topology-operator.time-reconciliation.failure
  statement: Periodic reconciliation, deleted topology recovery, and message loss
    boundaryのfailure Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 専用Environment内だけに停止、Network断、Resource Alarmまたは依存先障害を注入し、保証Invariantを検証する。
- id: proof.topology-operator.time-reconciliation.recovery
  statement: Periodic reconciliation, deleted topology recovery, and message loss
    boundaryのrecovery Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 障害要因を取り除き、Membership、Delivery、Telemetryとデータ整合性が制限時間内に回復することを確認する。
- id: proof.topology-operator.time-reconciliation.operations
  statement: Periodic reconciliation, deleted topology recovery, and message loss
    boundaryのoperations Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - Metrics、Logs、Health、CLI状態を同一Run IDと時刻で相関し、診断から安全な復旧判定まで接続する。
- id: proof.topology-operator.time-reconciliation.performance
  statement: Periodic reconciliation, deleted topology recovery, and message loss
    boundaryのperformance Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 条件を固定した複数VariantでRaw Sample、分位、Rate、Memory、Diskを取得し、適用範囲外へ一般化しない。
