schema_version: 1
id: definitive.quorum.leader-rebalance.claim
atlas_id: rabbitmq-reference-atlas
capability_id: queue.quorum
statement: Quorum replica reconciliation and leader rebalanceのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-quorum-queues
proof_obligations:
- id: proof.quorum.leader-rebalance.normal
  statement: Quorum replica reconciliation and leader rebalanceのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.quorum.leader-rebalance.boundary
  statement: Quorum replica reconciliation and leader rebalanceのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.quorum.leader-rebalance.rejection
  statement: Quorum replica reconciliation and leader rebalanceのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.quorum.leader-rebalance.operations
  statement: Quorum replica reconciliation and leader rebalanceのoperations Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - Metrics、Logs、Health、CLI状態を同一Run IDと時刻で相関し、診断から安全な復旧判定まで接続する。
- id: proof.quorum.leader-rebalance.performance
  statement: Quorum replica reconciliation and leader rebalanceのperformance Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 条件を固定した複数VariantでRaw Sample、分位、Rate、Memory、Diskを取得し、適用範囲外へ一般化しない。
