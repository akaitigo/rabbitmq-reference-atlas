schema_version: 1
id: definitive.upgrade.path.claim
atlas_id: rabbitmq-reference-atlas
capability_id: migration.upgrade
statement: Supported RabbitMQ version upgrade pathのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-upgrade
proof_obligations:
- id: proof.upgrade.path.normal
  statement: Supported RabbitMQ version upgrade pathのnormal Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.upgrade.path.boundary
  statement: Supported RabbitMQ version upgrade pathのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.upgrade.path.rejection
  statement: Supported RabbitMQ version upgrade pathのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.upgrade.path.migration
  statement: Supported RabbitMQ version upgrade pathのmigration Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定したSourceとTarget Versionの間で継続Workloadを実行し、互換性とRollback不能境界を記録する。
- id: proof.upgrade.path.compatibility
  statement: Supported RabbitMQ version upgrade pathのcompatibility Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 二つ以上のProtocol、Client、Queue、PluginまたはVersion Variantを同一Oracleで比較する。
