schema_version: 1
id: definitive.ldap.outage.claim
atlas_id: rabbitmq-reference-atlas
capability_id: security.ldap
statement: LDAP timeout outage and diagnostic behaviorのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-ldap
proof_obligations:
- id: proof.ldap.outage.normal
  statement: LDAP timeout outage and diagnostic behaviorのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.ldap.outage.boundary
  statement: LDAP timeout outage and diagnostic behaviorのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.ldap.outage.rejection
  statement: LDAP timeout outage and diagnostic behaviorのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.ldap.outage.failure
  statement: LDAP timeout outage and diagnostic behaviorのfailure Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 専用Environment内だけに停止、Network断、Resource Alarmまたは依存先障害を注入し、保証Invariantを検証する。
- id: proof.ldap.outage.recovery
  statement: LDAP timeout outage and diagnostic behaviorのrecovery Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 障害要因を取り除き、Membership、Delivery、Telemetryとデータ整合性が制限時間内に回復することを確認する。
- id: proof.ldap.outage.operations
  statement: LDAP timeout outage and diagnostic behaviorのoperations Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - Metrics、Logs、Health、CLI状態を同一Run IDと時刻で相関し、診断から安全な復旧判定まで接続する。
