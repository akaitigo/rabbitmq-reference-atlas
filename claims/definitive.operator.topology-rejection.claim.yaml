schema_version: 1
id: definitive.operator.topology-rejection.claim
atlas_id: rabbitmq-reference-atlas
capability_id: operator.topology
statement: Topology Operator credential and reconciliation limitationsのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-operator-overview
proof_obligations:
- id: proof.operator.topology-rejection.normal
  statement: Topology Operator credential and reconciliation limitationsのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.operator.topology-rejection.boundary
  statement: Topology Operator credential and reconciliation limitationsのboundary
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.operator.topology-rejection.rejection
  statement: Topology Operator credential and reconciliation limitationsのrejection
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.operator.topology-rejection.failure
  statement: Topology Operator credential and reconciliation limitationsのfailure Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 専用Environment内だけに停止、Network断、Resource Alarmまたは依存先障害を注入し、保証Invariantを検証する。
- id: proof.operator.topology-rejection.recovery
  statement: Topology Operator credential and reconciliation limitationsのrecovery
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 障害要因を取り除き、Membership、Delivery、Telemetryとデータ整合性が制限時間内に回復することを確認する。
- id: proof.operator.topology-rejection.security
  statement: Topology Operator credential and reconciliation limitationsのsecurity
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 最小権限の許可と、誤Credential、不正なTrust、越権操作の拒否を同一隔離Environmentで検証する。
