schema_version: 1
id: definitive.mqtt.session-expiry-clean.claim
atlas_id: rabbitmq-reference-atlas
capability_id: protocol.mqtt
statement: Clean session, session expiry, queue TTL, and state deletion boundaryのRabbitMQ
  4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-mqtt
proof_obligations:
- id: proof.mqtt.session-expiry-clean.normal
  statement: Clean session, session expiry, queue TTL, and state deletion boundaryのnormal
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.mqtt.session-expiry-clean.boundary
  statement: Clean session, session expiry, queue TTL, and state deletion boundaryのboundary
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.mqtt.session-expiry-clean.rejection
  statement: Clean session, session expiry, queue TTL, and state deletion boundaryのrejection
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.mqtt.session-expiry-clean.failure
  statement: Clean session, session expiry, queue TTL, and state deletion boundaryのfailure
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 専用Environment内だけに停止、Network断、Resource Alarmまたは依存先障害を注入し、保証Invariantを検証する。
- id: proof.mqtt.session-expiry-clean.recovery
  statement: Clean session, session expiry, queue TTL, and state deletion boundaryのrecovery
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 障害要因を取り除き、Membership、Delivery、Telemetryとデータ整合性が制限時間内に回復することを確認する。
