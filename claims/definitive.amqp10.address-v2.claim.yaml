source_ids:
- rabbitmq-4.3-amqp-1.0
proof_obligations:
- id: proof.amqp10.address-v2.normal
  statement: RabbitMQ AMQP 1.0 address format v2のnormal Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.amqp10.address-v2.boundary
  statement: RabbitMQ AMQP 1.0 address format v2のboundary Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.amqp10.address-v2.rejection
  statement: RabbitMQ AMQP 1.0 address format v2のrejection Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.amqp10.address-v2.migration
  statement: RabbitMQ AMQP 1.0 address format v2のmigration Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定したSourceとTarget Versionの間で継続Workloadを実行し、互換性とRollback不能境界を記録する。
