proof_obligations:
- id: proof.topology-operator.vhost.normal
  statement: Virtual host creation, limits, default queue type, and deletionのnormal
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.topology-operator.vhost.boundary
  statement: Virtual host creation, limits, default queue type, and deletionのboundary
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.topology-operator.vhost.rejection
  statement: Virtual host creation, limits, default queue type, and deletionのrejection
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.topology-operator.vhost.security
  statement: Virtual host creation, limits, default queue type, and deletionのsecurity
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 最小権限の許可と、誤Credential、不正なTrust、越権操作の拒否を同一隔離Environmentで検証する。
