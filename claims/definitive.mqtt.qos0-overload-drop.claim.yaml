- id: proof.mqtt.qos0-overload-drop.recovery
  statement: MQTT QoS 0 mailbox soft limit drop and metric behaviorのrecovery Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 障害要因を取り除き、Membership、Delivery、Telemetryとデータ整合性が制限時間内に回復することを確認する。
- id: proof.mqtt.qos0-overload-drop.operations
  statement: MQTT QoS 0 mailbox soft limit drop and metric behaviorのoperations Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - Metrics、Logs、Health、CLI状態を同一Run IDと時刻で相関し、診断から安全な復旧判定まで接続する。
- id: proof.mqtt.qos0-overload-drop.performance
  statement: MQTT QoS 0 mailbox soft limit drop and metric behaviorのperformance Scenarioを専用実Runtime
