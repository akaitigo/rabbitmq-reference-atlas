- id: proof.mqtt.qos0-overload-drop.rejection
  statement: MQTT QoS 0 mailbox soft limit drop and metric behaviorのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.mqtt.qos0-overload-drop.failure
  statement: MQTT QoS 0 mailbox soft limit drop and metric behaviorのfailure Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
