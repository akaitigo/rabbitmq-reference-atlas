- id: proof.mqtt.session-queue-cardinality.rejection
  statement: Subscriber session creation of zero, one, or two QoS queuesのrejection
    Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.mqtt.session-queue-cardinality.operations
  statement: Subscriber session creation of zero, one, or two QoS queuesのoperations
    Scenarioを専用実Runtime Evidenceで証明する。
