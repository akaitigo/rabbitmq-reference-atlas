schema_version: 1
id: definitive.shovel.dynamic.claim
atlas_id: rabbitmq-reference-atlas
capability_id: crosscluster.shovel
statement: Dynamic Shovel lifecycle through runtime parametersのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-shovel
proof_obligations:
- id: proof.shovel.dynamic.normal
  statement: Dynamic Shovel lifecycle through runtime parametersのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.shovel.dynamic.boundary
  statement: Dynamic Shovel lifecycle through runtime parametersのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.shovel.dynamic.rejection
  statement: Dynamic Shovel lifecycle through runtime parametersのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.shovel.dynamic.operations
  statement: Dynamic Shovel lifecycle through runtime parametersのoperations Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - Metrics、Logs、Health、CLI状態を同一Run IDと時刻で相関し、診断から安全な復旧判定まで接続する。
