schema_version: 1
id: definitive.operator.feature-flags.claim
atlas_id: rabbitmq-reference-atlas
capability_id: operator.cluster
statement: Operator feature flag enablement policyのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-operator-overview
proof_obligations:
- id: proof.operator.feature-flags.normal
  statement: Operator feature flag enablement policyのnormal Scenarioを専用実Runtime Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.operator.feature-flags.boundary
  statement: Operator feature flag enablement policyのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.operator.feature-flags.rejection
  statement: Operator feature flag enablement policyのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.operator.feature-flags.migration
  statement: Operator feature flag enablement policyのmigration Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定したSourceとTarget Versionの間で継続Workloadを実行し、互換性とRollback不能境界を記録する。
- id: proof.operator.feature-flags.compatibility
  statement: Operator feature flag enablement policyのcompatibility Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 二つ以上のProtocol、Client、Queue、PluginまたはVersion Variantを同一Oracleで比較する。
