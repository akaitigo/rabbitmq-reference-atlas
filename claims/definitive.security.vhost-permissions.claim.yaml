schema_version: 1
id: definitive.security.vhost-permissions.claim
atlas_id: rabbitmq-reference-atlas
capability_id: security.permissions
statement: Virtual host configure, write, and read permissionsのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-access-control
proof_obligations:
- id: proof.security.vhost-permissions.normal
  statement: Virtual host configure, write, and read permissionsのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.security.vhost-permissions.boundary
  statement: Virtual host configure, write, and read permissionsのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.security.vhost-permissions.rejection
  statement: Virtual host configure, write, and read permissionsのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.security.vhost-permissions.security
  statement: Virtual host configure, write, and read permissionsのsecurity Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 最小権限の許可と、誤Credential、不正なTrust、越権操作の拒否を同一隔離Environmentで検証する。
