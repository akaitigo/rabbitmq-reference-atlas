schema_version: 1
id: definitive.prometheus.aggregation.claim
atlas_id: rabbitmq-reference-atlas
capability_id: observability.prometheus
statement: Per-object and aggregated metric tradeoffのRabbitMQ 4.3.5における公開契約は、Authorityから導出した各必須Scenarioの実行結果と一致する。
status: proposed
source_ids:
- rabbitmq-4.3-prometheus
proof_obligations:
- id: proof.prometheus.aggregation.normal
  statement: Per-object and aggregated metric tradeoffのnormal Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 固定Versionの実Runtimeで正常入力を実行し、期待Outcomeを構造化Artifactで判定する。
- id: proof.prometheus.aggregation.boundary
  statement: Per-object and aggregated metric tradeoffのboundary Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 上限、下限、空、重複または優先順位の境界を一つずつ変え、反証可能なOracleで判定する。
- id: proof.prometheus.aggregation.rejection
  statement: Per-object and aggregated metric tradeoffのrejection Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 無効な設定、Credential、Protocolまたは操作を与え、部分成功を認めず明示的な拒否を確認する。
- id: proof.prometheus.aggregation.operations
  statement: Per-object and aggregated metric tradeoffのoperations Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - Metrics、Logs、Health、CLI状態を同一Run IDと時刻で相関し、診断から安全な復旧判定まで接続する。
- id: proof.prometheus.aggregation.performance
  statement: Per-object and aggregated metric tradeoffのperformance Scenarioを専用実Runtime
    Evidenceで証明する。
  acceptance_criteria:
  - 条件を固定した複数VariantでRaw Sample、分位、Rate、Memory、Diskを取得し、適用範囲外へ一般化しない。
