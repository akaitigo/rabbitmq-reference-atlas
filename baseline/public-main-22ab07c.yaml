  title: Performance and capacity model
  target_set: performance-capacity
  kind: performance
  requirement: required
  state: covered
  rationale: 一般化した性能値ではなく、固定条件の測定とRaw Dataから利用者が自身の容量判断を行える必要がある。
  claim_ids:
  - performance.fixed-workload
  evidence_ids:
  - lab.performance-capacity
- id: mastery.compatibility-integration
  title: Protocol and client compatibility
  target_set: compatibility-integration
  kind: compatibility
  requirement: required
  state: covered
  rationale: AMQP 0-9-1以外のProtocol、Client、Plugin、Queue Type間の互換性を未検証のまま一般化しないために必要である。
