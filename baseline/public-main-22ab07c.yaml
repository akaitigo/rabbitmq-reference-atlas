- id: mastery.security-safety
  title: Security and isolation
  target_set: security-safety
  kind: security
  requirement: required
  state: covered
  rationale: Transport、Identity、Authorization、Secret Rotation、Tenant Isolationを正常系と拒否系の両方で証明する必要がある。
  claim_ids:
  - security.least-privilege
  - security.tls-transport
  evidence_ids:
  - lab.security-authz
  - lab.security-tls
