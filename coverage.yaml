schema_version: 1
atlas_id: rabbitmq-reference-atlas
epoch: '2026-08-28'
authority_lock_digest: sha256:09c7e172622e8ad1dde0401f01e625586f1e9231165f10ab40cd8e60f7ddcb0c
target_sets:
- id: messaging-surface
  title: Messaging Surface
  sequence: 1
  completion_required: true
  exit_criteria:
  - ExchangeとQueueの宣言、Binding、Publish、Consumeを固定Versionで再実行できること
  - Acknowledgement、Redelivery、Dead Letteringの境界を自動判定できること
- id: delivery-pressure
  title: Delivery and Pressure
  sequence: 2
  completion_required: true
  exit_criteria:
  - Prefetchによる未確認配送数の制御を観測可能なOracleで検証できること
  - Publisher ConfirmとConsumer Acknowledgementを異なる保証境界として記録すること
- id: cluster-resilience
  title: Cluster Resilience
  sequence: 3
  completion_required: true
  exit_criteria:
  - 三ノードClusterとQuorum Queueの構成を固定環境で再現できること
  - Leader停止後の継続配送とNode復帰を再実行可能に検証できること
- id: atlas-operation
  title: Atlas Operation
  sequence: 4
  completion_required: true
  exit_criteria:
  - EvidenceがSource、Harness、EnvironmentのDigestへ束縛されていること
  - Router Skillが設計、実装、診断、移行、ReviewとCoverage Gapを区別すること
- id: foundations-design
  title: Foundations and Design
  sequence: 5
  completion_required: true
  exit_criteria:
  - RabbitMQの責任範囲、配送保証、複製原理、製品境界を一次資料から説明できること
  - Queue Type、Routing、Retry、Cluster方式を要件とFailure Modelから選択できること
- id: operations-observability
  title: Operations and Observability
  sequence: 6
  completion_required: true
  exit_criteria:
  - Broker、Queue、Replica、Client、依存先の主要TelemetryとAlert条件を検証できること
  - Alertから診断、Runbook、復旧判定までを再実行可能に接続できること
- id: security-safety
  title: Security and Safety
  sequence: 7
  completion_required: true
  exit_criteria:
  - TLS、認証、認可、Credential Lifecycle、Tenant境界を実行証拠で検証できること
  - Failure Labと診断手順が許可された隔離環境だけへ作用すること
- id: performance-capacity
  title: Performance and Capacity
  sequence: 8
  completion_required: true
  exit_criteria:
  - 固定Workloadと環境条件からThroughput、Latency、Resource使用量を再測定できること
  - Queue Type、Replica、Payload、Backlog、PrefetchのTrade-offを容量判断へ戻せること
- id: compatibility-integration
  title: Compatibility and Integration
  sequence: 9
  completion_required: true
  exit_criteria:
  - Protocol、Client、Plugin、Queue Type、Feature Flagの対応Matrixを固定Versionで検証できること
  - 相互運用で保持される意味論と失われる意味論をEvidenceから説明できること
- id: migration-evolution
  title: Migration and Evolution
  sequence: 10
  completion_required: true
  exit_criteria:
  - 対象Upgrade Path、削除済み機能、Feature Flag、Plugin互換性を固定できること
  - Workload継続中の移行、Rollback境界、Blue-Green手順を実行証拠へ接続できること
- id: protocols-client-contracts
  title: Protocols and Client Contracts
  sequence: 11
  completion_required: true
  exit_criteria:
  - AMQP 0-9-1、AMQP 1.0、MQTT、STOMP、Stream ProtocolとWebSocket TransportをVersion固定のClientで検証できること
  - Protocol間変換、Reconnect、Topology Recovery、Flow Controlの保証境界を比較できること
- id: control-plane-configuration
  title: Management, CLI, Configuration, and Feature Flags
  sequence: 12
  completion_required: true
  exit_criteria:
  - Management HTTP API、rabbitmqctl、rabbitmq-diagnostics、rabbitmq-pluginsの許可・拒否・障害時の挙動を検証できること
  - rabbitmq.conf、advanced.config、Environment、Runtime Parameter、Policy、Feature Flagの優先順位と変更影響を再現できること
- id: cross-cluster-messaging
  title: Cross-cluster Messaging
  sequence: 13
  completion_required: true
  exit_criteria:
  - FederationとShovelを別Cluster間で実行し、停止・再接続・重複・保証境界を検証できること
  - Exchange Federation、Queue Federation、Dynamic Shovelの選択を同一Failure Modelで比較できること
- id: data-protection
  title: Backup and Restore
  sequence: 14
  completion_required: true
  exit_criteria:
  - DefinitionsとMessage Dataの保護範囲を区別し、正常Restoreと不適合Artifact拒否を再現できること
  - 復旧後のTopology、Permission、Queue Type、Message整合性をArtifact Evidenceで確認できること
- id: operator-platform
  title: Kubernetes Operators
  sequence: 15
  completion_required: true
  exit_criteria:
  - 固定VersionのCluster Operatorが三Replica RabbitmqClusterを調停し、障害後に宣言状態へ回復できること
  - Topology Operatorの正常・拒否・更新・削除・TLS境界を実Kubernetes Runtimeで検証できること
- id: integrated-reference-system
  title: Integrated Reference System
  sequence: 16
  completion_required: true
  exit_criteria:
  - Producer、Consumer、Operator、Telemetry、Security、Cross-cluster Recoveryを一つのReference
    Systemで統合できること
  - 正常・境界・拒否・障害・回復を独立LabだけでなくEnd-to-Endで再現できること
- id: definitive-assurance
  title: Definitive Assurance
  sequence: 17
  completion_required: true
  exit_criteria:
  - Authority Inventory、Coverage、Claim、Proof Obligation、Evidence、Skill Evalの全LinkがCore
    Definitive Gate v2で検査されること
  - 全必須ScenarioとRuntime Profileが閉じるまでDefinitive Certificateを発行しないこと
targets:
