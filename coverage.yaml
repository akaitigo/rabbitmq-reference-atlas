schema_version: 1
atlas_id: rabbitmq-reference-atlas
epoch: '2026-08-28'
authority_lock_digest: sha256:91cc188ce4fa664745afdaf5d1b3d7681c0d3647b35ca4fbf702a7df25e9ef69
target_sets:
- id: messaging-surface
  title: Messaging Surface
  sequence: 1
  completion_required: true
  exit_criteria:
  - ExchangeとQueueの宣言、Binding、Publish、Consumeを固定Versionで再実行できること
  - Acknowledgement、Redelivery、Dead Letteringの境界を自動判定できること
- id: delivery-pressure
  title: Delivery and Pressure
  sequence: 2
  completion_required: true
  exit_criteria:
  - Prefetchによる未確認配送数の制御を観測可能なOracleで検証できること
  - Publisher ConfirmとConsumer Acknowledgementを異なる保証境界として記録すること
- id: cluster-resilience
  title: Cluster Resilience
  sequence: 3
  completion_required: true
  exit_criteria:
  - 三ノードClusterとQuorum Queueの構成を固定環境で再現できること
  - Leader停止後の継続配送とNode復帰を再実行可能に検証できること
- id: atlas-operation
  title: Atlas Operation
  sequence: 4
  completion_required: true
  exit_criteria:
  - EvidenceがSource、Harness、EnvironmentのDigestへ束縛されていること
  - Router Skillが設計、実装、診断、移行、ReviewとCoverage Gapを区別すること
- id: foundations-design
  title: Foundations and Design
  sequence: 5
  completion_required: true
  exit_criteria:
  - RabbitMQの責任範囲、配送保証、複製原理、製品境界を一次資料から説明できること
  - Queue Type、Routing、Retry、Cluster方式を要件とFailure Modelから選択できること
- id: operations-observability
  title: Operations and Observability
  sequence: 6
  completion_required: true
  exit_criteria:
  - Broker、Queue、Replica、Client、依存先の主要TelemetryとAlert条件を検証できること
  - Alertから診断、Runbook、復旧判定までを再実行可能に接続できること
- id: security-safety
  title: Security and Safety
  sequence: 7
  completion_required: true
  exit_criteria:
  - TLS、認証、認可、Credential Lifecycle、Tenant境界を実行証拠で検証できること
  - Failure Labと診断手順が許可された隔離環境だけへ作用すること
- id: performance-capacity
  title: Performance and Capacity
  sequence: 8
  completion_required: true
  exit_criteria:
  - 固定Workloadと環境条件からThroughput、Latency、Resource使用量を再測定できること
  - Queue Type、Replica、Payload、Backlog、PrefetchのTrade-offを容量判断へ戻せること
- id: compatibility-integration
  title: Compatibility and Integration
  sequence: 9
  completion_required: true
  exit_criteria:
  - Protocol、Client、Plugin、Queue Type、Feature Flagの対応Matrixを固定Versionで検証できること
  - 相互運用で保持される意味論と失われる意味論をEvidenceから説明できること
- id: migration-evolution
  title: Migration and Evolution
  sequence: 10
  completion_required: true
  exit_criteria:
  - 対象Upgrade Path、削除済み機能、Feature Flag、Plugin互換性を固定できること
  - Workload継続中の移行、Rollback境界、Blue-Green手順を実行証拠へ接続できること
targets:
- id: messaging.amqp-model
  title: AMQP 0-9-1 model boundary
  target_set: foundations-design
  kind: concept
  requirement: required
  state: covered
  rationale: Exchange、Binding、Queueの役割と宣言同値性を、競合宣言の拒否を含む実行結果で境界付ける。
  claim_ids:
  - messaging.amqp-model-boundary
  evidence_ids:
  - lab.amqp-model
- id: messaging.exchange-binding-matrix
  title: Exchange, binding, and queue routing matrix
  target_set: messaging-surface
  kind: capability
  requirement: required
  state: covered
  rationale: Direct、Topic、Fanout、Headersの正Routingと非一致Routingを同一固定環境で比較する。
  claim_ids:
  - messaging.exchange-binding-matrix
  evidence_ids:
  - lab.exchange-binding-matrix
- id: messaging.exchange-routing
  title: Exchange routing
  target_set: messaging-surface
  kind: capability
  requirement: required
  state: covered
  rationale: Direct ExchangeのBindingとRouting Keyにより、意図したQueueだけへ配送されることを実行証拠で確認する。
  claim_ids:
  - messaging.exchange-routing
  evidence_ids:
  - lab.exchange-queue
- id: messaging.queue-lifecycle
  title: Queue lifecycle
  target_set: messaging-surface
  kind: capability
  requirement: required
  state: covered
  rationale: Queueの宣言、利用、削除を隔離されたLabで再現し、残存ResourceをCleanupできる必要がある。
  claim_ids:
  - messaging.queue-lifecycle
  evidence_ids:
  - lab.exchange-queue
- id: delivery.acknowledgement
  title: Consumer acknowledgement
  target_set: messaging-surface
  kind: capability
  requirement: required
  state: covered
  rationale: Consumer AcknowledgementがBrokerからConsumerまでの配送境界を表すことを観測可能に検証する。
  claim_ids:
  - delivery.acknowledgement
  evidence_ids:
  - lab.ack-redelivery
- id: delivery.redelivery
  title: Redelivery after requeue
  target_set: messaging-surface
  kind: failure
  requirement: required
  state: covered
  rationale: 未確認MessageをRequeueした際にRedelivered Flagを伴って再配送されることを検証する。
  claim_ids:
  - delivery.redelivery
  evidence_ids:
  - lab.ack-redelivery
- id: delivery.dead-lettering
  title: Dead letter routing
  target_set: messaging-surface
  kind: failure
  requirement: required
  state: covered
  rationale: RejectされたMessageが指定したDead Letter Exchangeを経由して隔離Queueへ到達することを検証する。
  claim_ids:
  - delivery.dead-lettering
  evidence_ids:
  - lab.dead-letter
- id: delivery.ttl-dead-lettering
  title: Message TTL and dead letter routing
  target_set: messaging-surface
  kind: failure
  requirement: required
  state: covered
  rationale: RejectだけでなくTTL超過によるDead LetteringをSource残数とx-death Headerで検証する。
  claim_ids:
  - delivery.ttl-dead-lettering
  evidence_ids:
  - lab.ttl-dead-letter
- id: delivery.flow-control
  title: Consumer flow control
  target_set: delivery-pressure
  kind: capability
  requirement: required
  state: covered
  rationale: Prefetch一件の条件でAcknowledgement前に二件目が配送されず、確認後に配送が再開することを検証する。
  claim_ids:
  - delivery.flow-control
  evidence_ids:
  - lab.consumer-flow-control
- id: delivery.publisher-flow-control
  title: Publisher flow control under resource alarm
  target_set: delivery-pressure
  kind: failure
  requirement: required
  state: covered
  rationale: Consumer PrefetchとBroker Resource AlarmによるPublisher Blockを区別し、Alarm解除後の再開まで検証する。
  claim_ids:
  - delivery.publisher-flow-control
  evidence_ids:
  - lab.publisher-flow-control
- id: delivery.publisher-confirm
  title: Publisher confirm
  target_set: delivery-pressure
  kind: capability
  requirement: required
  state: covered
  rationale: Publish処理とConsumer処理を混同せず、Broker受理をPublisher Confirmとして個別に検証する。
  claim_ids:
  - delivery.publisher-confirm
  evidence_ids:
  - lab.exchange-queue
- id: queue.quorum-stream
  title: Quorum queue and stream queue semantics
  target_set: foundations-design
  kind: capability
  requirement: required
  state: covered
  rationale: 複製Queueと追記型Streamを同一視せず、Confirm/AckとOffset Replayの異なる操作を固定Clusterで検証する。
  claim_ids:
  - queue.quorum-semantics
  - queue.stream-semantics
  evidence_ids:
  - lab.quorum-stream
  - lab.cluster-failure-recovery
- id: delivery.ordering-idempotency
  title: Ordering and application idempotency boundary
  target_set: delivery-pressure
  kind: concept
  requirement: required
  state: covered
  rationale: 順序を保証できる限定条件と、重複排除がApplication責任である境界を同じWorkloadで反証可能にする。
  claim_ids:
  - delivery.ordering-boundary
  - delivery.idempotency-boundary
  evidence_ids:
  - lab.ordering-idempotency
- id: cluster.three-node-membership
  title: Three-node cluster membership
  target_set: cluster-resilience
  kind: operation
  requirement: required
  state: covered
  rationale: 固定OCI Imageと構成から三ノードClusterを作り、全NodeがRunning Membersであることを確認する。
  claim_ids:
  - cluster.three-node-membership
  evidence_ids:
  - lab.cluster-membership
- id: cluster.leader-failure
  title: Quorum queue leader failure
  target_set: cluster-resilience
  kind: failure
  requirement: required
  state: covered
  rationale: Quorum QueueのLeader Nodeを停止しても多数派が残る条件で確定済みMessageを回収できることを検証する。
  claim_ids:
  - cluster.leader-failure
  evidence_ids:
  - lab.cluster-failure-recovery
- id: cluster.node-recovery
  title: Cluster node recovery
  target_set: cluster-resilience
  kind: operation
  requirement: required
  state: covered
  rationale: 停止したNodeを再起動し、Cluster Membershipへ復帰するまでを同一Harnessで確認する必要がある。
  claim_ids:
  - cluster.node-recovery
  evidence_ids:
  - lab.cluster-failure-recovery
- id: cluster.network-partition-recovery
  title: Network partition majority and replica recovery
  target_set: cluster-resilience
  kind: failure
  requirement: required
  state: covered
  rationale: Node停止とNetwork Partitionを区別し、多数派継続、少数派拒否、再接続後Replica復帰を専用Networkで検証する。
  claim_ids:
  - cluster.network-partition
  - cluster.partition-recovery
  evidence_ids:
  - lab.network-partition
- id: operation.reproducible-evidence
  title: Reproducible evidence
  target_set: atlas-operation
  kind: operation
  requirement: required
  state: covered
  rationale: 実行結果をSource、Harness、Environment、ArtifactのDigestへ束縛して再検証可能にする。
  claim_ids:
  - operation.reproducible-evidence
  evidence_ids:
  - operation.evidence-generation
- id: skill.router-evaluation
  title: Router Skill evaluation
  target_set: atlas-operation
  kind: skill
  requirement: required
  state: covered
  rationale: Routerが問い合わせを正しいModeとEvidenceへ案内し、対象外機能を捏造せずCoverage Gapを返すことを検証する。
  claim_ids:
  - skill.router-evaluation
  evidence_ids:
  - eval.router
- id: compatibility.fixed-client-queue-types
  title: Fixed AMQP client and queue type compatibility
  target_set: compatibility-integration
  kind: compatibility
  requirement: required
  state: covered
  rationale: ClientとBrokerのVersionを固定し、Classic、Quorum、Streamの対象操作を同一Harnessで実証する。
  claim_ids:
  - compatibility.fixed-client-queue-types
  evidence_ids:
  - lab.quorum-stream
- id: security.authorization-isolation
  title: Authentication, authorization, and vhost isolation
  target_set: security-safety
  kind: security
  requirement: required
  state: covered
  rationale: 正常認証だけでなくResource Permissionの許可・拒否を専用vhostで実証する。
  claim_ids:
  - security.least-privilege
  evidence_ids:
  - lab.security-authz
- id: security.tls-transport
  title: TLS and mutual TLS transport boundary
  target_set: security-safety
  kind: security
  requirement: required
  state: covered
  rationale: 正常なmTLSだけでなくTrust、Hostname、Client Identity、Plaintext拒否を専用環境で実証する。
  claim_ids:
  - security.tls-transport
  evidence_ids:
  - lab.security-tls
- id: observability.management-health
  title: Management health, alarms, and safe cleanup
  target_set: operations-observability
  kind: operation
  requirement: required
  state: covered
  rationale: 三NodeとQueueの状態、正常Health/Alarm、Lab Resource Cleanupを構造化Evidenceへ接続する。
  claim_ids:
  - observability.management-api
  - operation.health-and-alarms
  - operation.safe-cleanup
  evidence_ids:
  - lab.observability-health
- id: observability.queue-state-prometheus
  title: Queue state transition and Prometheus metrics
  target_set: operations-observability
  kind: operation
  requirement: required
  state: covered
  rationale: 静的なQueue=0だけでなくready→unacked→acked遷移と三Node Metricsを同一Runへ接続する。
  claim_ids:
  - observability.queue-state-transition
  - observability.prometheus-metrics
  evidence_ids:
  - lab.observability-state
- id: performance.fixed-workload
  title: Fixed workload performance measurement
  target_set: performance-capacity
  kind: performance
  requirement: required
  state: covered
  rationale: 普遍値を主張せず、固定条件のRaw Sample、分位、Rate、Resource Snapshotを容量判断の入力として再測定する。
  claim_ids:
  - performance.fixed-workload
  evidence_ids:
  - lab.performance-capacity
- id: migration.rolling-upgrade
  title: Three-node rolling upgrade from 4.2.9 to 4.3.5
  target_set: migration-evolution
  kind: migration
  requirement: required
  state: covered
  rationale: 実在してDigest固定できる4.2.9から4.3.5へ、Mixed-versionと継続Workloadを含む一台ずつのUpgradeを実証する。
